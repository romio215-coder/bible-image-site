<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오프라인 성경 읽기 · 말씀빛</title><style>body{background:#f7f4ec;color:#292824;font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:28px 22px}a{color:#4d5b45}h1{font-size:26px;margin-top:35px}p{line-height:1.9}article p{font-family:serif;font-size:21px;line-height:2;padding:9px 0}small{color:#76736d;font:13px system-ui;margin-right:12px}.notice{border-bottom:1px solid #e5e0d6;padding-bottom:23px}</style></head><body><a href="/">말씀빛 Bible · 다시 연결</a><p class="notice">지금은 오프라인입니다. 마지막으로 읽은 장을 표시합니다. 새로운 장과 검색은 인터넷에 연결한 후 이용해주세요.</p><main><h1 id="title">저장된 본문이 없습니다.</h1><article id="verses"></article><p>성경전서 개역한글판 · 대한성서공회</p></main><script>try{const chapter=JSON.parse(localStorage.getItem('wordlight:offline-chapter')||'null');if(chapter&&typeof chapter.name==='string'&&Array.isArray(chapter.verses)){document.getElementById('title').textContent=chapter.name+' '+chapter.chapter+'장';for(const verse of chapter.verses.slice(0,176)){if(typeof verse.text!=='string')continue;const p=document.createElement('p');const number=document.createElement('small');number.textContent=String(verse.number);p.append(number,document.createTextNode(verse.text));document.getElementById('verses').appendChild(p);}}}catch{document.getElementById('title').textContent='저장된 본문을 읽을 수 없습니다.'}</script></body></html>
